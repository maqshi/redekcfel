<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>arcydzieła</title>

<style>
  body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #fff;
    color: #111;
  }

  .box {
    max-width: 1050px;
    margin: 50px auto;
    background: #fff;
    border: 1px solid #eee;
    border-radius: 16px;
    padding: 28px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.08);
    text-align: center;
  }

  .gallery {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 15px;
    margin-top: 20px;
  }

  .gallery a {
    display: block;
    height: 180px;
    border-radius: 12px;
    overflow: hidden;
  }

  .gallery img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  .divider {
    width: 80%;
    height: 1px;
    background: #ddd;
    margin: 60px auto;
  }

  /* ===== TYTUŁ ===== */
  .section-title {
    text-align: center;
    font-size: 26px;
    font-weight: bold;
    margin-bottom: 20px;
    color: #111;
  }

  .bottom-gallery {
    max-width: 900px;
    margin: 40px auto;
    display: grid;
    gap: 15px;
    padding: 0 20px;
    grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
  }

  .bottom-gallery img {
    width: 100%;
    aspect-ratio: 9 / 16;
    object-fit: cover;
    border-radius: 12px;
    cursor: pointer;
  }

  .lightbox {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0,0,0,0.9);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 999;
  }

  .lightbox img {
    max-width: 90%;
    max-height: 90%;
    border-radius: 12px;
  }

  footer {
    margin-top: 60px;
    padding: 20px;
    background: #000;
    color: #fff;
    text-align: center;
  }
</style>
</head>

<body>

<div class="box">
  <h2>nasze wideła👀</h2>

  <div class="gallery">
    <a href="https://www.youtube.com/watch?v=uAAjNI-Yj4Y" target="_blank">
      <img src="2f1034d8-793f-45b8-871b-3d7f4182b456.jpg">
    </a>
    <a href="https://www.youtube.com/watch?v=ToWKO4c6jLkQ" target="_blank">
      <img src="elo (1).jpg">
    </a>
    <a href="https://www.youtube.com/watch?v=R0skIJB7FNs" target="_blank">
      <img src="elo (2).jpg">
    </a>
    <a href="https://www.youtube.com/watch?v=LPTb3NIHQcU" target="_blank">
      <img src="elo (3).jpg">
    </a>
  </div>
</div>

<div class="divider"></div>

<div class="section-title">
  zdjęcia naszego kochanego redka 🥀
</div>

<div class="bottom-gallery">
  <img src="1.jpg" onclick="openImage(this.src)">
  <img src="2.jpg" onclick="openImage(this.src)">
  <img src="3.jpg" onclick="openImage(this.src)">
  <img src="4.jpg" onclick="openImage(this.src)">
  <img src="5.jpg" onclick="openImage(this.src)">
  <img src="6.jpg" onclick="openImage(this.src)">
  <img src="7.jpg" onclick="openImage(this.src)">
  <img src="8.jpg" onclick="openImage(this.src)">
  <img src="elo (2).jpg" onclick="openImage(this.src)">
  <img src="elo (3).jpg" onclick="openImage(this.src)">
</div>

<div class="lightbox" id="lightbox" onclick="closeImage()">
  <img id="lightbox-img">
</div>

<footer>
  &copy; 2026 Redekcfel. Wszystkie prawa zastrzeżone<br>
  Strona powstała z miłości do Jakuba Retkowskiego
</footer>

<script>
  function openImage(src) {
    document.getElementById("lightbox-img").src = src;
    document.getElementById("lightbox").style.display = "flex";
  }

  function closeImage() {
    document.getElementById("lightbox").style.display = "none";
  }
</script>

</body>
</html>
