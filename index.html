<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>arcydzieła</title>

<style>
  body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #fff; /* biała strona */
    color: #111;
  }

  /* ===== BOX ===== */
  .box {
    max-width: 1050px;
    margin: 50px auto;
    background: #fff;
    border: 1px solid #eee;
    border-radius: 16px;
    padding: 28px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.08);
    text-align: center;
  }

  .box h2 {
    margin: 0;
    font-size: 28px;
  }

  .box p {
    color: #555;
  }

  /* ===== GALERIA ===== */
  .gallery {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 15px;
    margin-top: 20px;
  }

  .gallery a {
    display: block;
    height: 180px;
    border-radius: 12px;
    overflow: hidden;
    transition: 0.2s;
  }

  .gallery a:hover {
    transform: scale(1.03);
  }

  .gallery img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  /* ===== ZDJĘCIA ===== */
  .bottom-gallery {
    max-width: 1200px;
    margin: 40px auto;
    display: grid;
    gap: 15px;
    padding: 0 20px;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
  }

  .bottom-gallery img {
    width: 100%;
    height: 180px;
    object-fit: cover;
    border-radius: 12px;
  }

  /* ===== STOPKA (CZARNA) ===== */
  footer {
    margin-top: 60px;
    padding: 20px;
    background: #000;
    color: #fff;
    text-align: center;
  }
</style>
</head>

<body>

<!-- ===== BOX ===== -->
<div class="box">
  <h2>to nie filmy… to arcydzieła</h2>
  <p>kliknij i zobacz co tam siedzi 👀</p>

  <div class="gallery">
    <a href="https://www.youtube.com/watch?v=uAAjNI-Yj4Y" target="_blank">
      <img src="2f1034d8-793f-45b8-871b-3d7f4182b456.jpg">
    </a>
    <a href="https://www.youtube.com/watch?v=ToWKO4c6jLkQ" target="_blank">
      <img src="elo (1).jpg">
    </a>
    <a href="https://www.youtube.com/watch?v=R0skIJB7FNs" target="_blank">
      <img src="elo (2).jpg">
    </a>
    <a href="https://www.youtube.com/watch?v=LPTb3NIHQcU" target="_blank">
      <img src="elo (3).jpg">
    </a>
  </div>
</div>

<!-- ===== ZDJĘCIA ===== -->
<div class="bottom-gallery">
  <img src="1.jpg">
  <img src="2.jpg">
  <img src="3.jpg">
  <img src="4.jpg">
  <img src="5.jpg">
  <img src="6.jpg">
  <img src="7.jpg">
  <img src="8.jpg">
</div>

<!-- ===== STOPKA ===== -->
<footer>
  &copy; 2026 Redekcfel. Wszystkie prawa zastrzeżone.<br>
  Strona powstała z miłości do Jakuba Retkowskiego
</footer>

</body>
</html>
